name: Android

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Host tests and debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install SDK platform and build tools
        run: sdkmanager --install "platforms;android-34" "build-tools;34.0.0"

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.7"
          cache-provider: basic

      # Every host-testable module; device cases stay in TESTING.md.
      - name: Host tests
        run: gradle test --console=plain

      - name: Purity and hygiene gates
        run: |
          set -e
          if grep -R "^import android\." detect/src/main/kotlin; then
            echo "::error:::detect must stay pure Kotlin/JVM"
            exit 1
          fi
          if git ls-files | grep -iE '\.(jks|keystore|p12|pfx|pk8|pem|key)$'; then
            echo "::error::a key or keystore is tracked"
            exit 1
          fi

      - name: Debug APK
        run: gradle :app:assembleDebug --console=plain

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: |
            **/build/test-results/**
            **/build/reports/tests/**
          if-no-files-found: warn
          retention-days: 7

  checks:
    name: Required checks
    runs-on: ubuntu-latest
    needs: build
    if: always() && !cancelled()
    steps:
      - name: Verify build succeeded
        run: |
          if [ "${{ needs.build.result }}" != "success" ]; then
            echo "::error::build job did not succeed"
            exit 1
          fi
          echo "All required checks passed."
